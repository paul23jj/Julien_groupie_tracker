<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styleRecherche.css">
    <title>Recherche API-Steam</title>
</head>
<body>
    <header>
        <h1>Recherche de Jeux</h1>
        <nav>
la barre de paul
        </nav>
    </header>
    <main>
        <div class="search">
  <form action="/traitment/search" method="post">
    <input type="text" name="search" placeholder="recherche">
    <button type="submit">recherche</button>
  </form>
  </div>
    
    {{if .Query}}
    <section class="results">
        <h2>Résultats pour: {{.Query}}</h2>
        {{if .Results}}
        <ul>
        {{range .Results}}
            <li>{{.}}</li>
        {{end}}
        </ul>
        {{else}}
        <p>Aucun résultat.</p>
        {{end}}
    </section>
    {{end}}

    </main>
</body>
</html>
